# Scenario: SysOps & Infrastructure Monitoring
id: "sysops-scenario"
name: "SysOps Monitoring Scenario"
description: "Scenario chuyên biệt cho việc kiểm tra hạ tầng và ping mạng"
transport: "streamable-http"
host: "0.0.0.0"
port: 8001
prefix: "/sysops"
enable_gateway: true
enable_standalone: true

# Tham chiếu tới MCP Server gốc (Scenario biết server, server KO biết scenario)
servers:
  - "system-server"

fixtures:
  - "sysops_metrics.yaml"

# MCP Tool Error Simulations defined for this scenario (isError: true)
error_simulations:
  - tool: "calculate"
    message: "MCP Error [SysOps Scenario]: Calculation tool is restricted in infrastructure monitoring mode."
    is_error: true
