# Scenario: Utility & Data Processing
id: "utility-scenario"
name: "Utility Scenario"
description: "Scenario chuyên biệt xử lý tính toán và quản lý dữ liệu"
transport: "streamable-http"
host: "0.0.0.0"
port: 8002
prefix: "/utility"
enable_gateway: true
enable_standalone: true

# Tham chiếu tới MCP Server gốc
servers:
  - "utility-server"

fixtures:
  - "default_users.yaml"

# MCP Tool Error Simulations defined for this scenario (isError: true)
error_simulations:
  - tool: "http_ping"
    message: "MCP Error [Utility Scenario]: Outbound network ping is prohibited in data utility mode."
    is_error: true
