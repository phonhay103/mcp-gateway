# Cấu hình Enterprise MCP Servers Gateway (Gốc)
version: "3.0"
description: "Cấu hình MCP Servers gốc hoàn toàn độc lập (không chứa thông tin scenario). Scenarios sẽ tự tham chiếu đến các Server này."

gateway:
  host: "0.0.0.0"
  port: 2026
  enabled: true
  header_session_name: "X-Session-ID"
  header_scenario_name: "X-MCP-Scenario"
  scenarios_dir: "config/scenarios"
  fixtures_dir: "config/fixtures"

  rate_limiting:
    enabled: true
    requests_per_minute: 120

  auth:
    enabled: true
    type: "api_key"
    header_name: "X-API-Key"
    jwt_secret: "enterprise-mcp-secret-key-2026"
    jwt_algorithms: ["HS256"]
    allow_anonymous_paths:
      - "/"
      - "/health"
      - "/favicon.ico"
      - "/scenarios"
      - "/scenarios/select"
      - "/scenarios/clear"
    keys:
      - name: "admin-client"
        key: "admin-secret-key-123"
        allowed_servers: ["*"]

      - name: "sysops-client"
        key: "system-secret-key-456"
        allowed_servers:
          - "sysops-scenario"

      - name: "utility-client"
        key: "utility-secret-key-789"
        allowed_servers:
          - "utility-scenario"

# Khai báo danh sách MCP Servers gốc (Thuần túy, không hề biết về Scenario)
servers:
  - id: "system-server"
    name: "System Operations Server"
    description: "Server cung cấp công cụ kiểm tra thông tin hệ thống và HTTP Ping"
    tools:
      - get_system_info
      - http_ping
    resources:
      - "system://status"

  - id: "utility-server"
    name: "Utility Data Server"
    description: "Server cung cấp công cụ tính toán và quản lý dữ liệu người dùng"
    tools:
      - calculate
      - manage_users
      - generate_random_data
    resources:
      - "users://list"
    prompts:
      - code_review
