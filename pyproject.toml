[project]
name = "mcp-gateway"
version = "0.1.0"
description = "A mock Model Context Protocol (MCP) gateway running dynamic multi-MCP servers with Enterprise Security"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "starlette>=0.40.0",
    "httpx>=0.27.0",
    "fastmcp>=3.4.4",
    "loguru>=0.7.3",
    "mcp>=1.28.1",
    "pydantic>=2.10.0",
    "pyjwt>=2.10.0",
    "pyyaml>=6.0.2",
    "graphql-core>=3.2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "fastapi>=0.115.0",
]

[project.scripts]
mcp-gateway = "mcp_gateway.main:main"
mock-mcp = "mock_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Supply-chain lag: a release must be 7 days old before the resolver may pick
# it. Malicious or broken uploads are usually yanked within hours, so waiting
# turns the registry's own recall into our safety net. Relative on purpose —
# it is re-evaluated at every lock, not frozen to one date.
exclude-newer = "7 days"

