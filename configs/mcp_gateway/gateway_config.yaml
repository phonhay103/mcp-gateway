# Enterprise MCP Gateway Configuration
version: "3.0"
description: "Production-ready standalone Gateway configuration"

gateway:
  host: "0.0.0.0"
  port: 2026
  enabled: true

  rate_limiting:
    enabled: true
    requests_per_minute: 120

  auth:
    enabled: true
    type: "api_key"
    header_name: "X-API-Key"
    jwt_secret: "enterprise-mcp-secret-key-2026"
    jwt_algorithms: ["HS256"]
    allow_anonymous_paths:
      - "/"
      - "/health"
      - "/favicon.ico"
    keys:
      - name: "admin-client"
        key: "admin-secret-key-123"
        allowed_servers: ["*"]

      - name: "sysops-client"
        key: "system-secret-key-456"
        allowed_servers:
          - "sysops-scenario"

      - name: "utility-client"
        key: "utility-secret-key-789"
        allowed_servers:
          - "utility-scenario"

# List of statically registered Upstream Servers.
# For dynamic registration environments (such as Kubernetes auto-registration), leave this empty.
servers: []
