# Scenario: Chaos & Infrastructure Monitoring
id: "chaos-scenario"
name: "Chaos Simulation Scenario"
description: "Specialized scenario for simulating network faults, latency, and randomized error rates at the tool level."

tools:
  - echo
  - get_system_info
  - http_ping

tool_behaviors:
  echo:
    chaos:
      latency_ms: 100       # 100ms latency
      error_rate: 0.0       # 0% error rate to avoid random conflicts in tests
      http_status: 503      # Simulate HTTP 503 Service Unavailable error
