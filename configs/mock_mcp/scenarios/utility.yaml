# Scenario: Utility & Data Processing
id: "utility-scenario"
name: "Utility Scenario"
description: "Scenario chuyên biệt xử lý tính toán và quản lý dữ liệu"

tools:
  - calculate
  - manage_users
  - generate_random_data

fixtures:
  - "default_users.yaml"

# Chi tiết định nghĩa ở mức Tool-Level cho kết quả (mock_result) hoặc lỗi (error with isError: true)
tool_behaviors:
  http_ping:
    error:
      is_error: true
      message: "MCP Tool Error [Utility Scenario]: Outbound network egress is prohibited in data utility mode."
      code: -32001
      details:
        scenario_id: "utility-scenario"
        policy: "no_external_egress"

  generate_random_data:
    mock_result:
      status: "mock_generated"
      data_type: "fixed_test_sequence"
      items:
        - id: 1
          val: "seq_1"
        - id: 2
          val: "seq_2"
