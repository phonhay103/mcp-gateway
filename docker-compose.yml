services:
  mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: mcp-gateway
    ports:
      - "2026:2026"   # Shared Gateway Port
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2026/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mock-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-mcp
    ports:
      - "2027:2027"   # Standalone Mock MCP Port
    environment:
      - MCP_CONFIG_PATH=src/mock_mcp/config/mcp_servers.yaml
      - LOG_LEVEL=INFO
      - GATEWAY_REGISTER_URL=http://mcp-gateway:2026
      - MOCK_SERVICE_URL=http://mock-mcp:2027
      - GATEWAY_API_KEY=admin-secret-key-123
    volumes:
      - ./src/mock_mcp/config:/app/src/mock_mcp/config:ro
    restart: unless-stopped
    depends_on:
      - mcp-gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2027/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
