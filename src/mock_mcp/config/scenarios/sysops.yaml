# Scenario: SysOps & Infrastructure Monitoring
id: "sysops-scenario"
name: "SysOps Monitoring Scenario"
description: "Scenario chuyên biệt cho việc kiểm tra hạ tầng và ping mạng"
prefix: "/sysops"
enable_gateway: true

# Tham chiếu tới MCP Server gốc (Scenario biết server, server KO biết scenario)
servers:
  - "system-server"

fixtures:
  - "sysops_metrics.yaml"

# Chi tiết định nghĩa ở mức Tool-Level cho kết quả (mock_result) hoặc lỗi (error with isError: true)
tool_behaviors:
  calculate:
    error:
      is_error: true
      message: "MCP Tool Error [SysOps Scenario]: Math calculation module is restricted in infrastructure monitoring mode."
      code: -32603
      details:
        scenario_id: "sysops-scenario"
        policy: "security_read_only"
        reason: "Unauthorized math execution"

  get_system_info:
    mock_result:
      status: "sysops_healthy"
      mode: "high_availability"
      datacenter: "us-east-1"
